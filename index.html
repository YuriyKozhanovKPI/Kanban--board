<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Особиста Kanban-дошка справ</title>

    <link rel="stylesheet" href="css/style.css" />

    <script src="js/script.js" defer></script>
  </head>

  <body>
    <header class="site-header">
      <h1>Kanban board</h1>
    </header>

    <main class="kanban-board">
      <section class="kanban-column kanban-column--todo">
        <h2>To Do</h2>

        <div class="horizontal_border"></div>

        <div class="cards-list" id="todo-list">
          <article class="card">
            <h3>Заголовок завдання (тест)</h3>
            <p>Опис завдання (тест)</p>
          </article>
        </div>
      </section>

      <section class="kanban-column kanban-column--progress">
        <h2>In Progress</h2>

        <div class="horizontal_border"></div>

        <div class="cards-list" id="inprogress-list">
          <article class="card">
            <h3>Заголовок завдання (тест)</h3>
            <p>Опис завдання (тест)</p>
          </article>
        </div>
      </section>

      <section class="kanban-column kanban-column--done">
        <h2>Done</h2>

        <div class="horizontal_border"></div>

        <div class="cards-list" id="done-list">
          <article class="card">
            <h3>Заголовок завдання (тест)</h3>
            <p>Опис завдання (тест)</p>
          </article>
        </div>

        <p class="column-summary" id="done-count">Виконано задач: 0</p>
      </section>
    </main>

    <footer>
      <p>Виконав студент групи ІП-56 Кожанов Юрій Костянтинович 2026</p>
    </footer>
  </body>
</html>
